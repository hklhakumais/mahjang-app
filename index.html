<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>麻雀成績アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 pb-20">
  <div id="app">
    <header class="bg-green-600 text-white text-center p-4 font-bold text-lg shadow-md">
      麻雀成績管理
    </header>

    <main class="p-4">
      <!-- 🏠 ホーム画面（ダッシュボード） -->
      <div v-show="currentTab === 'home'">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold">成績ランキング</h2>
          <!-- 期間絞り込みフィルター -->
          <select class="border p-1 rounded text-sm bg-white shadow-sm">
            <option>全期間</option>
            <option>2026年</option>
            <option>2026年10月</option>
          </select>
        </div>

        <!-- ランキング表（サンプルデータ） -->
        <div class="bg-white rounded-xl shadow overflow-hidden mb-4">
          <table class="w-full text-sm text-center">
            <thead class="bg-gray-200 text-gray-700">
              <tr>
                <th class="py-2">順位</th>
                <th class="py-2">名前</th>
                <th class="py-2">総合pt</th>
                <th class="py-2">平均着順</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-b">
                <td class="py-2 font-bold text-yellow-600">1</td>
                <td class="py-2">Aさん</td>
                <td class="py-2 text-green-600 font-bold">+152.0</td>
                <td class="py-2">2.14</td>
              </tr>
              <tr class="border-b">
                <td class="py-2 font-bold text-gray-400">2</td>
                <td class="py-2">Cさん</td>
                <td class="py-2 text-green-600 font-bold">+45.5</td>
                <td class="py-2">2.35</td>
              </tr>
              <tr class="border-b">
                <td class="py-2 font-bold text-orange-400">3</td>
                <td class="py-2">Bさん</td>
                <td class="py-2 text-red-500 font-bold">-24.0</td>
                <td class="py-2">2.60</td>
              </tr>
              <tr>
                <td class="py-2 font-bold">4</td>
                <td class="py-2">Dさん</td>
                <td class="py-2 text-red-500 font-bold">-173.5</td>
                <td class="py-2">2.91</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 役満履歴 -->
        <h3 class="font-bold text-gray-700 mb-2">🏆 役満殿堂入り</h3>
        <div class="bg-white p-3 rounded-xl shadow flex items-center gap-3">
          <span class="text-2xl">🏅</span>
          <div>
            <p class="font-bold text-sm">国士無双 (Aさん)</p>
            <p class="text-xs text-gray-500">2026/09/20</p>
          </div>
        </div>
      </div>

      <!-- 👥 セット画面（成績入力） -->
      <div v-show="currentTab === 'set'">
        <h2 class="text-xl font-bold mb-4">セット成績入力</h2>

        <!-- メンバー管理 -->
        <div class="bg-white p-4 rounded-xl shadow mb-4">
          <h3 class="font-bold text-sm text-gray-700 mb-2">メンバー管理</h3>
          <div class="flex gap-2 mb-2">
            <input v-model="newMemberName" type="text" placeholder="新しい名前" class="border p-2 rounded w-full text-sm">
            <button @click="addMember" class="bg-blue-500 text-white px-4 rounded font-bold text-sm">追加</button>
          </div>
          <div class="flex flex-wrap gap-2 mt-3">
            <span v-for="member in members" :key="member" class="bg-gray-200 text-gray-800 px-2 py-1 rounded text-xs font-bold">
              {{ member }}
            </span>
          </div>
        </div>

        <!-- スコア入力 -->
        <div class="bg-white p-4 rounded-xl shadow">
          <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">対局日</label>
            <input v-model="matchDate" type="date" class="border p-2 rounded w-full">
          </div>
          
          <h3 class="font-bold text-sm text-gray-700 mb-2">スコア入力（自動着順）</h3>
          <div v-for="(player, index) in currentMatch" :key="index" class="mb-3 flex items-center gap-2">
            <select v-model="player.name" class="border p-2 rounded w-2/5 text-sm">
              <option value="">名前を選択</option>
              <option v-for="m in members" :key="m" :value="m">{{ m }}</option>
            </select>
            <input v-model.number="player.score" @input="calculateRanks" type="number" placeholder="持ち点" class="border p-2 rounded w-2/5 text-right text-sm">
            <div class="w-1/5 text-center font-bold" :class="{'text-red-500': player.rank === 1}">
              {{ player.rank }}位
            </div>
          </div>

          <!-- 🏆 役満入力エリア -->
          <div class="mt-4 border-t pt-4">
            <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mb-2">
              <input type="checkbox" v-model="hasYakuman" class="w-4 h-4"> 役満が出た場合記録する
            </label>
            <div v-if="hasYakuman" class="flex gap-2 bg-yellow-50 p-3 rounded">
              <select class="border p-2 rounded w-1/2 text-sm">
                <option value="">和了者</option>
                <option v-for="p in currentMatch.filter(p => p.name)" :key="p.name">{{ p.name }}</option>
              </select>
              <input type="text" placeholder="役満名 (例: 大三元)" class="border p-2 rounded w-1/2 text-sm">
            </div>
          </div>

          <button class="bg-green-600 text-white w-full py-3 rounded-lg font-bold mt-4 shadow">
            この成績を保存する
          </button>
        </div>
      </div>

      <!-- 👤 フリー画面 -->
      <div v-show="currentTab === 'free'">
        <h2 class="text-xl font-bold mb-4">フリー麻雀（個人）</h2>
        <div class="bg-white p-4 rounded-xl shadow">
          <p class="text-gray-600 text-sm">ここに個人の収支入力画面を作ります。他の人には見えません。</p>
        </div>
      </div>
    </main>

    <!-- 下部のタブナビゲーション -->
    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-2 pb-6 shadow-lg">
      <button @click="currentTab = 'home'" :class="{'text-green-600 font-bold': currentTab === 'home', 'text-gray-400': currentTab !== 'home'}" class="flex flex-col items-center w-1/3">
        <span class="text-2xl mb-1">🏠</span>
        <span class="text-[10px]">ホーム</span>
      </button>
      <button @click="currentTab = 'set'" :class="{'text-green-600 font-bold': currentTab === 'set', 'text-gray-400': currentTab !== 'set'}" class="flex flex-col items-center w-1/3">
        <span class="text-2xl mb-1">👥</span>
        <span class="text-[10px]">セット</span>
      </button>
      <button @click="currentTab = 'free'" :class="{'text-green-600 font-bold': currentTab === 'free', 'text-gray-400': currentTab !== 'free'}" class="flex flex-col items-center w-1/3">
        <span class="text-2xl mb-1">👤</span>
        <span class="text-[10px]">フリー</span>
      </button>
    </nav>
  </div>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const currentTab = ref('home'); // 最初はホーム（ランキング）を表示
        
        const members = ref(['Aさん', 'Bさん', 'Cさん', 'Dさん']);
        const newMemberName = ref('');
        const matchDate = ref(new Date().toISOString().slice(0, 10));
        const hasYakuman = ref(false);
        
        const currentMatch = ref([
          { name: '', score: null, rank: '-' },
          { name: '', score: null, rank: '-' },
          { name: '', score: null, rank: '-' },
          { name: '', score: null, rank: '-' }
        ]);

        const addMember = () => {
          if (newMemberName.value && !members.value.includes(newMemberName.value)) {
            members.value.push(newMemberName.value);
            newMemberName.value = '';
          }
        };

        const calculateRanks = () => {
          const scores = currentMatch.value
            .filter(p => p.score !== null && p.score !== '')
            .map(p => p.score)
            .sort((a, b) => b - a);

          currentMatch.value.forEach(p => {
            if (p.score !== null && p.score !== '') {
              p.rank = scores.indexOf(p.score) + 1;
            } else {
              p.rank = '-';
            }
          });
        };

        return { 
          currentTab, members, newMemberName, matchDate, currentMatch, hasYakuman,
          addMember, calculateRanks 
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
