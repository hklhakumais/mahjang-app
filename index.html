<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>麻雀成績アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-20">
  <div id="app">
    <header class="bg-green-600 text-white text-center p-4 font-bold text-lg shadow-md flex justify-between items-center">
      <span>麻雀成績管理</span>
      <select v-if="currentTab !== 'free'" class="bg-green-700 text-white text-sm border-none rounded p-1">
        <option>会社の麻雀部 (セット)</option>
        <option>地元の友人 (セット)</option>
      </select>
    </header>

    <main class="p-4">
      <!-- 🏠 ホーム画面 -->
      <div v-show="currentTab === 'home'">
        <h2 class="text-xl font-bold mb-4">成績ランキング</h2>
        <div class="bg-white rounded-xl shadow overflow-hidden mb-4">
          <table class="w-full text-sm text-center">
            <thead class="bg-gray-200 text-gray-700">
              <tr>
                <th class="py-2">順位</th>
                <th class="py-2">名前</th>
                <th class="py-2">総合pt</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-b"><td class="py-2 font-bold text-yellow-600">1</td><td class="py-2">Aさん</td><td class="py-2 text-green-600 font-bold">+152.0</td></tr>
              <tr class="border-b"><td class="py-2 font-bold text-gray-400">2</td><td class="py-2">Cさん</td><td class="py-2 text-green-600 font-bold">+45.5</td></tr>
            </tbody>
          </table>
          <p class="text-xs text-gray-500 text-center p-2">※保存されたデータをもとに後ほど自動計算させます</p>
        </div>
      </div>

      <!-- 👥 セット画面 -->
      <div v-show="currentTab === 'set'">
        <h2 class="text-xl font-bold mb-4">セット成績入力</h2>

        <div class="bg-white p-4 rounded-xl shadow mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">適用ルール</label>
          <select v-model="selectedRule" class="border p-2 rounded w-full text-sm bg-blue-50">
            <option>Mリーグルール (10-30 / オカあり)</option>
            <option>完全順位戦 (10-20-30)</option>
            <option>点数そのまま (ウマオカなし)</option>
          </select>
        </div>

        <div class="bg-white p-4 rounded-xl shadow mb-4">
          <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">対局日</label>
            <input v-model="matchDate" type="date" class="border p-2 rounded w-full">
          </div>
          
          <div class="flex justify-between items-end mb-2 border-b pb-2">
            <h3 class="font-bold text-sm text-gray-700">結果入力</h3>
            <select v-model="inputType" @change="calculateRanks" class="border p-1 rounded text-xs bg-gray-50">
              <option value="score">素点入力 (例: 26000)</option>
              <option value="point">ポイント入力 (例: +6.0, -15.5)</option>
            </select>
          </div>

          <div v-for="(player, index) in currentMatch" :key="index" class="mb-3 flex items-center gap-2">
            <select v-model="player.name" class="border p-2 rounded w-2/5 text-sm">
              <option value="">名前を選択</option>
              <option v-for="m in members" :key="m" :value="m">{{ m }}</option>
            </select>
            <input v-model.number="player.score" @input="calculateRanks" type="number" inputmode="decimal" :placeholder="inputType === 'score' ? '持ち点' : 'pt'" class="border p-2 rounded w-2/5 text-right text-sm">
            <div class="w-1/5 text-center font-bold" :class="{'text-red-500': player.rank === 1}">
              {{ player.rank }}位
            </div>
          </div>

          <div class="p-2 rounded text-center text-sm font-bold mt-2" :class="isSumValid ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
            {{ inputType === 'score' ? '合計: ' + totalSum + ' 点' : 'ポイント合計: ' + totalSum }}
            <span v-if="!isSumValid" class="block text-xs">（数値が合っていません）</span>
          </div>

          <button @click="saveToCloud" class="bg-green-600 text-white w-full py-3 rounded-lg font-bold mt-4 shadow disabled:opacity-50" :disabled="!isSumValid">
            クラウドに保存して次の半荘へ
          </button>
        </div>
      </div>

      <!-- 👤 フリー画面 -->
      <div v-show="currentTab === 'free'">
        <h2 class="text-xl font-bold mb-4">フリー成績入力</h2>
        <div class="bg-white p-4 rounded-xl shadow">
          <p class="text-gray-600 text-sm">後ほど実装します</p>
        </div>
      </div>
    </main>

    <!-- 下部タブ -->
    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-2 pb-6 shadow-lg">
      <button @click="currentTab = 'home'" :class="{'text-green-600 font-bold': currentTab === 'home', 'text-gray-400': currentTab !== 'home'}" class="flex flex-col items-center w-1/3"><span class="text-2xl mb-1">🏠</span><span class="text-[10px]">ホーム</span></button>
      <button @click="currentTab = 'set'" :class="{'text-green-600 font-bold': currentTab === 'set', 'text-gray-400': currentTab !== 'set'}" class="flex flex-col items-center w-1/3"><span class="text-2xl mb-1">👥</span><span class="text-[10px]">セット</span></button>
      <button @click="currentTab = 'free'" :class="{'text-green-600 font-bold': currentTab === 'free', 'text-gray-400': currentTab !== 'free'}" class="flex flex-col items-center w-1/3"><span class="text-2xl mb-1">👤</span><span class="text-[10px]">フリー</span></button>
    </nav>
  </div>

  <script type="module">
    // FirebaseとVueの必要な機能を読み込む
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { createApp, ref, computed } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

    // いただいた専用の鍵（Firebase Config）
    const firebaseConfig = {
      apiKey: "AIzaSyDVhqc0taaYIAdjN89Flp5jXXgk3MjNUAA",
      authDomain: "mahjang-app.firebaseapp.com",
      projectId: "mahjang-app",
      storageBucket: "mahjang-app.firebasestorage.app",
      messagingSenderId: "668068320734",
      appId: "1:668068320734:web:ad06c784d01f4c1401f94f"
    };

    // Firebaseとデータベースの初期化
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Vueアプリの作成
    createApp({
      setup() {
        const currentTab = ref('set');
        const members = ref(['Aさん', 'Bさん', 'Cさん', 'Dさん']); 
        const matchDate = ref(new Date().toISOString().slice(0, 10));
        const selectedRule = ref('Mリーグルール (10-30 / オカあり)');
        const inputType = ref('score'); 
        
        const currentMatch = ref([
          { name: 'Aさん', score: null, rank: '-' },
          { name: 'Bさん', score: null, rank: '-' },
          { name: 'Cさん', score: null, rank: '-' },
          { name: 'Dさん', score: null, rank: '-' }
        ]);

        const calculateRanks = () => {
          const scores = currentMatch.value.filter(p => p.score !== null && p.score !== '').map(p => p.score).sort((a, b) => b - a);
          currentMatch.value.forEach(p => {
            if (p.score !== null && p.score !== '') p.rank = scores.indexOf(p.score) + 1;
            else p.rank = '-';
          });
        };

        const totalSum = computed(() => currentMatch.value.reduce((sum, p) => sum + (Number(p.score) || 0), 0));
        const isSumValid = computed(() => inputType.value === 'score' ? totalSum.value === 100000 : (totalSum.value === 0 && currentMatch.value.some(p => p.score !== null)));

        const saveToCloud = async () => {
          if(!isSumValid.value) return;
          
          try {
            // クラウド（Firestore）にデータを送信！
            await addDoc(collection(db, "matches"), {
              date: matchDate.value,
              rule: selectedRule.value,
              inputType: inputType.value,
              players: currentMatch.value.map(p => ({
                name: p.name,
                score: p.score,
                rank: p.rank
              })),
              createdAt: new Date()
            });
            
            alert('クラウドに成績を保存しました！');
            // 次の半荘のためにスコアだけリセット（名前は残る）
            currentMatch.value.forEach(p => { p.score = null; p.rank = '-'; });
          } catch (error) {
            console.error("エラー: ", error);
            alert('保存に失敗しました。');
          }
        };

        return { currentTab, members, matchDate, selectedRule, currentMatch, inputType, calculateRanks, totalSum, isSumValid, saveToCloud };
      }
    }).mount('#app');
  </script>
</body>
</html>
