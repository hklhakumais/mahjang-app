<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>麻雀成績アプリ</title>
  <!-- デザイン崩れを防ぐTailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 画面切り替えをスムーズにするVue.js -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 pb-20">
  <div id="app">
    <!-- 上部のヘッダー -->
    <header class="bg-green-600 text-white text-center p-4 font-bold text-lg shadow-md">
      麻雀成績管理
    </header>

    <!-- メインコンテンツ（画面の切り替え部分） -->
    <main class="p-4">
      <!-- 🏠 ホーム画面 -->
      <div v-show="currentTab === 'home'">
        <h2 class="text-xl font-bold mb-4">ホーム</h2>
        <div class="bg-white p-4 rounded-xl shadow">
          <p class="text-gray-600 text-sm">直近の成績や累計グラフがここに表示されます。</p>
        </div>
      </div>

      <!-- 👥 セット画面 -->
      <div v-show="currentTab === 'set'">
        <h2 class="text-xl font-bold mb-4">セット麻雀（共有）</h2>
        <div class="bg-white p-4 rounded-xl shadow">
          <p class="text-gray-600 text-sm">ここにメンバー4人のスコア入力画面を作ります。入力すると全員に共有されます。</p>
        </div>
      </div>

      <!-- 👤 フリー画面 -->
      <div v-show="currentTab === 'free'">
        <h2 class="text-xl font-bold mb-4">フリー麻雀（個人）</h2>
        <div class="bg-white p-4 rounded-xl shadow">
          <p class="text-gray-600 text-sm">ここに個人の収支入力画面を作ります。他の人には見えません。</p>
        </div>
      </div>
    </main>

    <!-- 下部のタブナビゲーション -->
    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-2 pb-6 shadow-lg">
      <button @click="currentTab = 'home'" :class="{'text-green-600 font-bold': currentTab === 'home', 'text-gray-400': currentTab !== 'home'}" class="flex flex-col items-center w-1/3">
        <span class="text-2xl mb-1">🏠</span>
        <span class="text-[10px]">ホーム</span>
      </button>
      <button @click="currentTab = 'set'" :class="{'text-green-600 font-bold': currentTab === 'set', 'text-gray-400': currentTab !== 'set'}" class="flex flex-col items-center w-1/3">
        <span class="text-2xl mb-1">👥</span>
        <span class="text-[10px]">セット</span>
      </button>
      <button @click="currentTab = 'free'" :class="{'text-green-600 font-bold': currentTab === 'free', 'text-gray-400': currentTab !== 'free'}" class="flex flex-col items-center w-1/3">
        <span class="text-2xl mb-1">👤</span>
        <span class="text-[10px]">フリー</span>
      </button>
    </nav>
  </div>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        // 初期状態は 'home' タブを表示する
        const currentTab = ref('home');
        return { currentTab };
      }
    }).mount('#app');
  </script>
</body>
</html>
